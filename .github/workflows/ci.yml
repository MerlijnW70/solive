name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: system packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev protobuf-compiler
      - name: rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: agave
        env:
          AGAVE_VERSION: v4.1.2
          AGAVE_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
        run: |
          curl -sSfL -o "$RUNNER_TEMP/agave.tar.bz2" "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum --check --strict
          mkdir -p "$HOME/agave"
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$HOME/agave"
          echo "$HOME/agave/solana-release/bin" >> "$GITHUB_PATH"
      - name: anchor
        env:
          ANCHOR_REV: 84a63f9f7112b23581816436fbcf3f6c515779f9
        run: |
          cargo install --git https://github.com/solana-foundation/anchor --rev "$ANCHOR_REV" anchor-cli --locked --force
          test "$(anchor --version)" = "anchor-cli $(sed -n 's/^anchor_version = "\(.*\)"/\1/p' Anchor.toml)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - name: check
        run: bash scripts/ci.sh
      - name: packages
        run: bash scripts/pack-test.sh

  node-floor:
    if: github.event_name != 'schedule'
    needs: verifiable
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: agave
        env:
          AGAVE_VERSION: v4.1.2
          AGAVE_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
        run: |
          curl -sSfL -o "$RUNNER_TEMP/agave.tar.bz2" "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum --check --strict
          mkdir -p "$HOME/agave"
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$HOME/agave"
          echo "$HOME/agave/solana-release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: intent-engine-verifiable
          path: verifiable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: test
        run: |
          export INTENT_ENGINE_SO="$GITHUB_WORKSPACE/verifiable/intent_engine.so"
          bash scripts/ts-test.sh

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: secrets
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a
        with:
          tool: cargo-deny@0.20.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: audit
        run: bash scripts/audit.sh

  verifiable:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: system packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libudev-dev
      - name: solana-verify
        run: cargo install --locked solana-verify --version 0.5.2
      - name: build
        run: bash scripts/verify.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intent-engine-verifiable
          path: |
            verifiable/intent_engine.so
            verifiable/intent_engine.hash

  attest:
    if: github.event_name == 'push' && !github.event.repository.private
    needs: verifiable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: intent-engine-verifiable
          path: verifiable
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: verifiable/intent_engine.so

  fuzz:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUZZ_TOOLCHAIN: nightly-2026-10-04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: toolchains
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: fuzz
        run: bash scripts/fuzz.sh 120

  proofs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: kani
        env:
          KANI_VERSION: 0.68.0
          KANI_SHA256: 32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3
        run: |
          bundle="$RUNNER_TEMP/kani-$KANI_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$bundle" "https://github.com/model-checking/kani/releases/download/kani-$KANI_VERSION/kani-$KANI_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KANI_SHA256  $bundle" | sha256sum --check --strict
          cargo install kani-verifier --locked --version "$KANI_VERSION"
          cargo kani setup --use-local-bundle "$bundle"
      - name: prove
        run: bash scripts/kani.sh

  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dco.sh "$BASE_SHA" "$HEAD_SHA"
