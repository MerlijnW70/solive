name: monitor

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  devnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SECOND_RPC: ${{ secrets.SECOND_DEVNET_RPC }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - name: the program and its config match the baseline, the filler fills and the filler and faucet hold SOL
        run: npx --yes @intent-engine/cli@0.1.66 monitor --expect monitoring/devnet.json --url devnet --max-fills 50 --max-fill So11111111111111111111111111111111111111112=10000000000 --min-balance EuagWg1chJxXVJAXm2GiGiivtMRKGaFCFWY8G8PPM6My=1 --min-balance CrYx7JA1TRwGtpn9T6C2mVsRgMP7XztGRwZdasV9XSLS=3 --max-swap-wait 600 --once --since 3900
      - name: a second node agrees
        if: env.SECOND_RPC != ''
        run: npx --yes @intent-engine/cli@0.1.66 monitor --expect monitoring/devnet.json --url "$SECOND_RPC" --max-fills 50 --max-fill So11111111111111111111111111111111111111112=10000000000 --once --since 3900
