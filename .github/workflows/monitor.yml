name: monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  devnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SECOND_RPC: ${{ secrets.ALCHEMY_DEVNET_RPC }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - name: the program and its config match the baseline
        run: npx --yes @intent-engine/cli@0.1.43 monitor --expect monitoring/devnet.json --url devnet --max-fills 50 --once
      - name: a second node agrees
        if: env.SECOND_RPC != ''
        run: npx --yes @intent-engine/cli@0.1.43 monitor --expect monitoring/devnet.json --url "$SECOND_RPC" --max-fills 50 --once
