name: faucet

on:
  issues:
    types: [opened]
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: faucet
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name == 'schedule' || contains(github.event.issue.labels.*.name, 'faucet') || github.event.issue.title == 'Devnet SOL'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: waiting
        id: waiting
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          untagged=$(gh issue list --state open --limit 100 --search 'in:title "Devnet SOL" -label:faucet' --json number,title --jq '.[] | select(.title == "Devnet SOL") | .number')
          waiting=$(gh issue list --label faucet --state open --limit 100 --json number,labels --jq '.[] | select(all(.labels[]; .name != "faucet-sent")) | .number')
          pending=$(gh issue list --label faucet-pending --state all --limit 1000 --json number --jq '.[].number')
          open=$(printf '%s\n%s\n%s\n' "$waiting" "$untagged" "$pending" | { grep -Ex '[0-9]+' || true; } | sort -nu | wc -l)
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: github.event_name == 'issues' || steps.waiting.outputs.open != '0'
        with:
          persist-credentials: false
      - uses: ./.github/actions/agave
        if: github.event_name == 'issues' || steps.waiting.outputs.open != '0'
      - name: send
        if: github.event_name == 'issues' || steps.waiting.outputs.open != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAUCET_SECRET: ${{ secrets.FAUCET_KEYPAIR }}
        run: |
          umask 077
          printf '%s' "$FAUCET_SECRET" > "$RUNNER_TEMP/faucet.json"
          FAUCET_KEYPAIR="$RUNNER_TEMP/faucet.json" bash scripts/faucet.sh
