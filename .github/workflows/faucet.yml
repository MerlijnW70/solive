name: faucet

on:
  issues:
    types: [opened]
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: faucet
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name == 'schedule' || contains(github.event.issue.labels.*.name, 'faucet') || github.event.issue.title == 'Devnet SOL'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: waiting
        id: waiting
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          titled=$(gh issue list --state open --limit 100 --search 'in:title "Devnet SOL"' --json number --jq 'length')
          labelled=$(gh issue list --state open --label faucet --limit 100 --json labels --jq '[.[] | select(all(.labels[]; .name != "faucet-sent"))] | length')
          echo "open=$((titled + labelled))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: github.event_name == 'issues' || steps.waiting.outputs.open != '0'
        with:
          persist-credentials: false
      - name: agave
        if: github.event_name == 'issues' || steps.waiting.outputs.open != '0'
        env:
          AGAVE_VERSION: v4.1.2
          AGAVE_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
        run: |
          curl -sSfL -o "$RUNNER_TEMP/agave.tar.bz2" "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum --check --strict
          mkdir -p "$HOME/agave"
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$HOME/agave"
          echo "$HOME/agave/solana-release/bin" >> "$GITHUB_PATH"
      - name: send
        if: github.event_name == 'issues' || steps.waiting.outputs.open != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAUCET_SECRET: ${{ secrets.FAUCET_KEYPAIR }}
        run: |
          umask 077
          printf '%s' "$FAUCET_SECRET" > "$RUNNER_TEMP/faucet.json"
          FAUCET_KEYPAIR="$RUNNER_TEMP/faucet.json" bash scripts/faucet.sh
