name: agave
description: install the pinned agave release and put its tools on the path
runs:
  using: composite
  steps:
    - name: agave
      shell: bash
      env:
        AGAVE_VERSION: v4.1.2
        AGAVE_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
      run: |
        curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/agave.tar.bz2" "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
        echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum --check --strict
        mkdir -p "$HOME/agave"
        tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$HOME/agave"
        echo "$HOME/agave/solana-release/bin" >> "$GITHUB_PATH"
