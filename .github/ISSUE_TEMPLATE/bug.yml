name: Report a bug
description: Something on devnet or in the CLI did not do what the docs say.
labels: [bug]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The commands, with keypair paths and addresses you would rather not share left out.
      render: sh
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The output or error, as printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `intent-engine version`.
    validations:
      required: true
