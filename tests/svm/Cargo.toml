[package]
name = "svm-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
base64 = "0.22"
bincode = "1"
bytemuck = { workspace = true }
intent-core = { workspace = true }
solana-system-interface = { version = "3.3", features = ["bincode"] }
intent-engine = { path = "../../programs/intent_engine", features = ["no-entrypoint"] }
litesvm = { workspace = true }
serde_json = "1"
solana-ed25519-program = { workspace = true }
solana-instructions-sysvar = { workspace = true }
solana-sha256-hasher = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-signer = { workspace = true }
solana-slot-hashes = "3.2"
solana-address-lookup-table-interface = { version = "3.1", features = ["bincode"] }
solana-transaction = { workspace = true, features = ["serde"] }
solana-transaction-error = { workspace = true }
solana-instruction-error = { workspace = true }

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
