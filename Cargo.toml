[workspace]
resolver = "2"
members = ["crates/*", "programs/*", "tests/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions"] }
solana-ed25519-program = "=3.0.0"
solana-instructions-sysvar = "=3.0.1"
solana-sha256-hasher = "3.1"
bytemuck = { version = "1.23", features = ["derive", "min_const_generics"] }
intent-core = { path = "crates/intent-core" }
litesvm = { version = "=0.17.0", features = ["precompiles"] }
solana-address = "2.7"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-transaction-error = "3.4"
solana-instruction-error = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(kani)'] }

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.dev]
overflow-checks = true
