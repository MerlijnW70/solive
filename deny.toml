[graph]
exclude-dev = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained, not vulnerable; it comes in through anchor-lang and the agave crates and has no maintained replacement upstream yet" },
    { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek 3.2.0 only reaches the LiteSVM test simulator through ed25519-dalek 1.0.1 in agave-precompiles; the program uses the fixed 4.1.3" },
    { id = "RUSTSEC-2022-0093", reason = "ed25519-dalek 1.0.1 only reaches the LiteSVM test simulator through agave-precompiles; the program uses 2.2.0 and never signs" },
    { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 is unmaintained and only reaches the LiteSVM test simulator through agave-precompiles and solana-syscalls" },
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained proc-macro used at build time by ark-ff inside solana-syscalls for the test simulator" },
    { id = "RUSTSEC-2024-0388", reason = "derivative is an unmaintained proc-macro used at build time by ark-ec inside solana-syscalls for the test simulator" },
    { id = "RUSTSEC-2021-0139", reason = "ansi_term is unmaintained and only formats LiteSVM test logs" },
]

[licenses]
version = 2
confidence-threshold = 0.9
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
